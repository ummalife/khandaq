# KHANDAQ (audit A19): build the Android release APK in CI and produce verifiable SLSA build provenance
# via GitHub OIDC (no secret needed for the attestation). Runs on demand + on release tags only, so it
# adds no per-push load. If the upload keystore is supplied as repo secrets, the built APK is the SIGNED
# shippable artifact; otherwise it is an unsigned reference build. Either way anyone can run
#   gh attestation verify <apk> -R ummalife/khandaq
# to prove the artifact was built by this workflow from a specific commit (reproducible provenance).
name: release-provenance

on:
  workflow_dispatch:
  push:
    tags:
      - 'android-v*'
      - 'v*'

permissions:
  contents: read
  id-token: write        # OIDC token used to sign the provenance
  attestations: write    # record the attestation on the repo

jobs:
  build-attest:
    # KHANDAQ (audit 2026-08-21, K-06): pinned instead of `ubuntu-latest`. GitHub-hosted runners cannot
    # be pinned by digest, but the version label is the difference between "the image GitHub happens to
    # point the alias at today" and a stated one: when the alias moves to the next LTS, that becomes a
    # reviewed commit here instead of a silent change to what signed artifacts are built on. This label
    # is what `ubuntu-latest` already resolves to, so the pin changes nothing about today's build.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: '17'

      # KHANDAQ (audit 2026-08-21, K-06): fail closed on toolchain provisioning, and install what the
      # build files actually declare. The full reasoning — including why the old `|| true` was
      # load-bearing rather than merely sloppy, and why releases nevertheless succeeded without the
      # packages this step claimed to provide — is in scripts/ci-android-toolchain.sh.
      - name: Install and verify the Android toolchain (fail closed)
        run: |
          set -euo pipefail
          bash scripts/ci-android-toolchain.sh install khandaq-android-trifa/android-refimpl-app
          bash scripts/ci-android-toolchain.sh snapshot "$RUNNER_TEMP/sdk-before.txt"

      - name: Provide google-services.json (real from secret, else placeholder for the build)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          f=khandaq-android-trifa/android-refimpl-app/app/google-services.json
          # google-services.json is gitignored (audit A21 — it held the committed Firebase key), so it is
          # absent on a fresh CI checkout. Use the real config if the owner supplies it as a secret (that
          # yields the SHIPPABLE build); otherwise write a placeholder with the correct package so the
          # google-services plugin is satisfied and we can still build an unsigned REFERENCE artifact to
          # attest. The placeholder is created in the runner only, never committed.
          if [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
            printf '%s' "${GOOGLE_SERVICES_JSON}" > "$f"
            echo "using google-services.json from secret"
          elif [ ! -f "$f" ]; then
            cat > "$f" <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "khandaq-messenger",
              "storage_bucket": "khandaq-messenger.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": { "package_name": "com.khandaq.messenger" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "PLACEHOLDER_NOT_A_REAL_KEY_reference_build_only" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          JSON
            echo "wrote placeholder google-services.json (unsigned reference build)"
          fi

      - name: Verify committed dependency pins (gradle witness) — never regenerate them here
        run: |
          set -euo pipefail
          cd khandaq-android-trifa/android-refimpl-app
          chmod +x ./gradlew
          w=app/witness.gradle
          # audit2 #2: pinChecksums only walks the assertions it finds, so an empty or truncated witness file
          # would make the gate pass vacuously. Require the committed pin list to still be there.
          n=$(grep -cE "^[[:space:]]*'[^']+:[0-9a-f]{64}'," "$w" || true)
          echo "committed dependency pins: $n"
          if [ "$n" -lt 100 ]; then
            echo "::error::witness.gradle holds only $n pins - refusing to build/attest a release from an unpinned tree" >&2
            exit 1
          fi
          # audit2 #2: this step used to run "calculateChecksums || true", which emptied and rewrote witness.gradle
          # from whatever this runner had just downloaded - i.e. a substituted maven artifact would have been
          # re-pinned, built, signed and attested. The release path must ONLY verify, and must fail on mismatch.
          # A legitimate dependency bump is a reviewed commit of app/witness.gradle (see gradle_witness_ng.gradle
          # header / the manual "witness-checksums-update" workflow).
          ./gradlew --no-daemon -PrunWitnessChecker=true :app:pinChecksums

      # audit2 closing note: the reviewer's sharpest point was that this app had zero JVM unit tests, so
      # nothing caught a regression automatically. Tests nobody runs are not tests — a failure here stops
      # the release before anything is built, signed or attested. The suite is pure-function (packet header
      # bounds + reassembly state machines), so it needs no device, no network and cannot be flaky.
      - name: Run JVM unit tests
        run: |
          set -euo pipefail
          cd khandaq-android-trifa/android-refimpl-app
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest
          # A green run over an empty suite would be the same vacuous pass the pin gate was fixed for.
          total=$(grep -ho 'tests="[0-9]*"' app/build/test-results/testDebugUnitTest/*.xml \
                  | grep -oE '[0-9]+' | awk '{s+=$1} END {print s+0}')
          echo "unit tests executed: ${total:-0}"
          if [ "${total:-0}" -lt 1 ]; then
            echo "::error::testDebugUnitTest reported no executed tests - refusing to pass vacuously" >&2
            exit 1
          fi

      # KHANDAQ (re-audit 2026-08-21, R-05): release lint was disabled outright — checkReleaseBuilds
      # false AND abortOnError false — so nothing on the signing path ever ran it. It is a gate again,
      # and deliberately a NARROW one: app/lint.xml demotes every category to warning and promotes
      # Security to fatal, so lintVitalRelease (which by construction runs only fatal issues) is
      # exactly a security gate. Turning the whole of lint on instead would have meant 2378 findings
      # on this inherited codebase, and a gate that red on day one is a gate somebody disables again.
      #
      # It runs BEFORE assembleRelease, so nothing is built, signed or attested on a red gate.
      #
      # Proven by mutation on a real SDK: removing the one reviewed exclusion fails it, and injecting
      # android:debuggable="true" — a Security finding it was never told about — fails it too, while
      # the 52 pre-existing Fatal translation issues do not.
      - name: Android security lint gate (release)
        run: |
          set -euo pipefail
          cd khandaq-android-trifa/android-refimpl-app
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:lintVitalRelease
          # The gate must not have quietly rewritten its own configuration, same as the witness pins.
          git diff --exit-code -- app/lint.xml

      - name: Build release APK
        env:
          KHANDAQ_UPLOAD_STORE_FILE: ${{ secrets.KHANDAQ_UPLOAD_STORE_FILE }}
          KHANDAQ_UPLOAD_PASSWORD: ${{ secrets.KHANDAQ_UPLOAD_PASSWORD }}
          KHANDAQ_UPLOAD_ALIAS: ${{ secrets.KHANDAQ_UPLOAD_ALIAS }}
        run: |
          set -euo pipefail
          cd khandaq-android-trifa/android-refimpl-app
          chmod +x ./gradlew
          ARGS=""
          if [ -n "${KHANDAQ_UPLOAD_STORE_FILE:-}" ]; then
            ARGS="-PKHANDAQ_UPLOAD_STORE_FILE=${KHANDAQ_UPLOAD_STORE_FILE} -PKHANDAQ_UPLOAD_PASSWORD=${KHANDAQ_UPLOAD_PASSWORD} -PKHANDAQ_UPLOAD_ALIAS=${KHANDAQ_UPLOAD_ALIAS}"
          fi
          ./gradlew --no-daemon :app:assembleRelease ${ARGS}
          find app/build/outputs/apk/release -name '*.apk'

      # audit2 #2: belt and braces - if anything in the build graph ever rewrites the pins again, the artifact
      # we are about to sign was not built against the reviewed pin list, so stop before attesting.
      - name: Assert the dependency pins were not rewritten during the build
        run: |
          set -euo pipefail
          git diff --exit-code -- khandaq-android-trifa/android-refimpl-app/app/witness.gradle

      # KHANDAQ (audit 2026-08-21, K-06): the same idea, applied to the toolchain rather than to the
      # Maven pins — and this is the check that makes the pinning real rather than decorative.
      #
      # AGP's `android.builder.sdkDownload` defaults to true, so a component missing from the pinned
      # set is not a build failure: Gradle fetches it from dl.google.com mid-build and carries on. An
      # install step alone therefore cannot guarantee what compiled the APK. Comparing the installed
      # set before and after the build can, and it needs no list of package names to be kept correct.
      #
      # It runs BEFORE the attestation step on purpose: if something was pulled in, nothing gets
      # signed or attested.
      - name: Assert no unpinned SDK component was auto-downloaded during the build
        run: |
          set -euo pipefail
          bash scripts/ci-android-toolchain.sh snapshot "$RUNNER_TEMP/sdk-after.txt"
          bash scripts/ci-android-toolchain.sh assert-unchanged \
            "$RUNNER_TEMP/sdk-before.txt" "$RUNNER_TEMP/sdk-after.txt"

      # KHANDAQ (audit 2026-08-21, K-06): "Include toolchain versions in provenance/SBOM." The
      # attestation answered "which workflow, which commit" and never "built with what". This records
      # that next to the APK, so it is covered by SHA256SUMS.txt and attested in the same run, and
      # echoes it into the run summary so it is readable without downloading anything.
      - name: Record the build toolchain
        env:
          KHANDAQ_RUNNER_LABEL: ubuntu-24.04
          KHANDAQ_SDK_SNAPSHOT: ${{ runner.temp }}/sdk-after.txt
        run: |
          set -euo pipefail
          out=khandaq-android-trifa/android-refimpl-app/app/build/outputs/apk/release/TOOLCHAIN.txt
          bash scripts/ci-android-toolchain.sh record khandaq-android-trifa/android-refimpl-app "$out"
          {
            echo '### Build toolchain'
            echo '```'
            cat "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd khandaq-android-trifa/android-refimpl-app/app/build/outputs/apk/release
          sha256sum *.apk TOOLCHAIN.txt | tee SHA256SUMS.txt

      - name: Attest build provenance (SLSA, via OIDC)
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1
        with:
          # KHANDAQ (K-06): the toolchain record is a subject too, so "what built it" is bound to the
          # same run as the artifact instead of being an unauthenticated note beside it.
          subject-path: |
            khandaq-android-trifa/android-refimpl-app/app/build/outputs/apk/release/*.apk
            khandaq-android-trifa/android-refimpl-app/app/build/outputs/apk/release/TOOLCHAIN.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: khandaq-android-release
          path: |
            khandaq-android-trifa/android-refimpl-app/app/build/outputs/apk/release/*.apk
            khandaq-android-trifa/android-refimpl-app/app/build/outputs/apk/release/SHA256SUMS.txt
            khandaq-android-trifa/android-refimpl-app/app/build/outputs/apk/release/TOOLCHAIN.txt
