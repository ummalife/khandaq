services:
  push-relay:
    build: ./relay
    container_name: khandaq-push-relay
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:8080"
    volumes:
      - /opt/khandaq-push/secrets:/run/secrets:ro
      # KHANDAQ (audit 2026-08-21, K-02): STATS_DB defaults to /data/stats.db, and /data had no
      # volume — so it lived in the container's writable layer and `docker compose up -d --build`,
      # which is the exact command in the rollout runbook, wiped it. That zeroes the auth-adoption
      # counters the "is it safe to set PUSH_AUTH_ENFORCE=1" decision is read from: a relay rebuilt
      # ten minutes ago and probed with two signed requests reports 100% adoption. A footgun pointed
      # at the same outage soft mode exists to prevent.
      #
      # Losing usedsig would be harmless (its whole retention is ~600s) and losing the rate window
      # only forgives a flood for one minute; the adoption history is the part that must survive.
      - push-relay-data:/data
    environment:
      - PORT=8080
      - FCM_PROJECT_ID=khandaq-messenger
      - FCM_SERVICE_ACCOUNT_FILE=/run/secrets/firebase-sa.json
      # KHANDAQ (audit A1): the relay must not run without auth. The secret is now MANDATORY --
      # `docker compose up` fails fast if it is unset (provide it via the shell / .env, kept OUT of
      # git: `set -a; . /opt/khandaq-push/.env; set +a`). PUSH_AUTH_ENFORCE stays 0 (soft/monitor) by
      # default so clients that do not sign yet keep working; flip it to 1 once client signing is
      # adopted (watch the "push auth SOFT" log lines drop to ~0). See docs/PUSH_AUTH_ROLLOUT.md.
      - PUSH_RELAY_AUTH_SECRET=${PUSH_RELAY_AUTH_SECRET:?set a strong random secret in /opt/khandaq-push/.env; it must match the value baked into the iOS/Android client builds}
      - PUSH_AUTH_ENFORCE=${PUSH_AUTH_ENFORCE:-0}
      - PUSH_AUTH_MAX_SKEW_SEC=${PUSH_AUTH_MAX_SKEW_SEC:-300}
      # KHANDAQ (audit 2026-08-21, K-02): an optional YYYY-MM-DD date after which a relay still
      # running in soft mode logs an error at startup and reports enforce_overdue on /health. It
      # never flips itself — a relay that enforced on a date, unattended, would silence every
      # unsigned client in the field at a moment nobody chose.
      - PUSH_AUTH_ENFORCE_BY=${PUSH_AUTH_ENFORCE_BY:-}

    # KHANDAQ (audit 2026-08-21, K-05): runtime hardening. None of this prevents a compromise; all of
    # it bounds what a compromise reaches. That matters here more than usual, because the container
    # has /run/secrets/firebase-sa.json mounted — a relay-code compromise IS an FCM-project
    # compromise, so the goal is to leave an attacker with as little else as possible.
    #
    # read_only makes the root filesystem immutable, so a foothold cannot drop a payload beside app.py
    # and wait for the next worker restart. The relay writes exactly two places, and both are declared
    # below: /data (its SQLite state, a named volume) and /tmp (gunicorn's worker heartbeat file,
    # which is why the Dockerfile passes --worker-tmp-dir /tmp).
    read_only: true
    tmpfs:
      # noexec/nosuid: a writable directory that cannot be used to execute what was written to it.
      - /tmp:rw,noexec,nosuid,size=32m
    # The relay binds 8080, not a privileged port, and touches no devices, no raw sockets, no clocks,
    # no mounts. There is nothing left to drop.
    cap_drop:
      - ALL
    security_opt:
      # Blocks the setuid/setgid escalation path outright: no child process can gain privileges the
      # relay does not already have, whatever binary it manages to run.
      - no-new-privileges:true
    # A wedged or leaking worker degrades one service instead of the host. gunicorn -w 2 on an idle
    # wake relay sits far below these; they are a ceiling, not a budget.
    mem_limit: 512m
    pids_limit: 256
    logging:
      # The relay logs a line per wake. Unbounded json-file logging is how a small VPS runs out of
      # disk, and this host also serves nginx and the site.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  push-relay-data:
