name: Changelog

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# KHANDAQ (security P-2): default to read-only. Only the push-triggered `commit` job below is granted
# contents: write (it auto-commits the regenerated changelog). The PR path (`verify`) stays read-only
# so a pull request can never obtain a write token via this workflow.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Generate changelog.json from git
        run: python3 scripts/generate-changelog.py

      - name: Verify changelog.json on pull request
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --exit-code web/changelog.json; then
            echo "::error::web/changelog.json is stale. Run: python3 scripts/generate-changelog.py"
            exit 1
          fi

  commit:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Generate changelog.json from git
        run: python3 scripts/generate-changelog.py

      - name: Auto-update changelog.json on master
        run: |
          if git diff --quiet web/changelog.json; then
            echo "changelog.json is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/changelog.json
          git commit -m "chore: regenerate changelog.json from git"
          git push
