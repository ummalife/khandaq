<!doctype html>
<html lang="{{lang}}" dir="{{dir}}">
<head>
<meta charset="utf-8">
<title>Khandaq App Store frame</title>
<style>
{{fonts}}

:root {
  --ink: #f5f5f0;
  --ink-soft: rgba(214, 240, 232, 0.78);
  --teal: #10b98f;
  --mint: #7fe9d2;
  --deep-1: #0c3a30;
  --deep-2: #0a2a23;
  --deep-3: #07130f;
  --bezel: #030605;
  --headline-font: {{headline_font}};
  --body-font: {{body_font}};
}

html, body {
  margin: 0;
  width: 1320px;
  height: 2868px;
  overflow: hidden;
  background: var(--deep-3);
}

.frame {
  position: relative;
  width: 1320px;
  height: 2868px;
  overflow: hidden;
  background:
    radial-gradient(1100px 820px at 50% 6%, rgba(16, 185, 143, 0.30), transparent 70%),
    radial-gradient(900px 900px at 100% 100%, rgba(12, 58, 48, 0.85), transparent 70%),
    linear-gradient(180deg, var(--deep-1) 0%, var(--deep-2) 40%, var(--deep-3) 100%);
}

/* The brand grid, faded out before it reaches the phone. */
.grid {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(127, 233, 210, 0.07) 2px, transparent 2px),
    linear-gradient(90deg, rgba(127, 233, 210, 0.07) 2px, transparent 2px);
  background-size: 132px 132px;
  background-position: -1px -1px;
  -webkit-mask-image: linear-gradient(180deg, #000 0%, rgba(0, 0, 0, 0.55) 22%, transparent 48%);
  mask-image: linear-gradient(180deg, #000 0%, rgba(0, 0, 0, 0.55) 22%, transparent 48%);
}

.copy {
  position: absolute;
  top: 0;
  left: 96px;
  right: 96px;
  height: 660px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 34px;
  text-align: center;
}

h1 {
  margin: 0;
  font-family: var(--headline-font);
  font-weight: 700;
  font-size: 112px;
  line-height: 1.08;
  letter-spacing: -0.02em;
  color: var(--ink);
  text-wrap: balance;
}

p {
  margin: 0;
  max-width: 1040px;
  font-family: var(--body-font);
  font-weight: 500;
  font-size: 50px;
  line-height: 1.32;
  color: var(--ink-soft);
  text-wrap: balance;
}

/* 960 x 2086 screen (the 1320 x 2868 capture scaled to 0.727) inside a 20px bezel. */
.phone {
  position: absolute;
  top: 702px;
  left: 160px;
  width: 1000px;
  height: 2126px;
  border-radius: 150px;
  background: var(--bezel);
  box-shadow:
    0 0 0 3px rgba(127, 233, 210, 0.20),
    0 60px 140px rgba(0, 0, 0, 0.55),
    inset 0 0 0 2px rgba(255, 255, 255, 0.06);
}

.screen {
  position: absolute;
  inset: 20px;
  border-radius: 130px;
  overflow: hidden;
  background: #000;
}

.screen img {
  display: block;
  width: 100%;
  height: 100%;
}

/* Arabic needs more line height than Latin or Cyrillic at the same size. */
:root[dir="rtl"] h1 { letter-spacing: 0; line-height: 1.3; font-size: 104px; }
:root[dir="rtl"] p { line-height: 1.5; font-size: 48px; }
</style>
</head>
<body>
<div class="frame">
  <div class="grid"></div>
  <div class="copy">
    <h1>{{title}}</h1>
    <p>{{subtitle}}</p>
  </div>
  <div class="phone"><div class="screen"><img src="{{shot}}" alt=""></div></div>
</div>
</body>
</html>
