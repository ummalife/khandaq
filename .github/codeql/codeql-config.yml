# KHANDAQ (re-review 2026-08-22, KQ-10) — CodeQL configuration.
#
# security/sast-fixtures/ is deliberately vulnerable code. It exists so that
# scripts/check-sast-fixtures.py can prove each Semgrep rule actually fires, and it is compiled by
# nothing and shipped in nothing. CodeQL found it immediately and correctly — a high-severity
# py/path-injection on the traversal fixture — which is the fixture working as designed and also a
# permanent red check on every pull request that touches it.
#
# So it is excluded here rather than suppressed alert by alert. The exclusion is narrow and stated:
# one directory whose entire purpose is to contain findings.
name: khandaq

# KHANDAQ (re-review v2 2026-08-22, RR2-11) — the TLS probe is excluded BY PATH, not by query.
#
# py/insecure-protocol used to be switched off for the entire repository because one loop in
# scripts/verify-site-deploy.py deliberately offers TLS 1.0 and 1.1 — the only way to establish that
# the server refuses them. The argument for that loop was sound and the cost was not: the same
# exclusion silently covered any future accidental use of an obsolete protocol in deployment or relay
# tooling, which is exactly what the query is for.
#
# The probe now lives alone in scripts/tls_probe.py, so the exclusion is that file. Everywhere else
# the query runs, and security/semgrep-khandaq.yml flags the same constants outside it.
paths-ignore:
  - security/sast-fixtures/**
  - scripts/tls_probe.py
