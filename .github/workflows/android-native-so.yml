name: android-native-so

# KHANDAQ (#201): rebuild the native toxcore JNI shared lib (libjni-c-toxcore.so) with the
# NGC media-resend head-of-line fix (patches/apply_khandaq_media_resend.py, wired into
# circle_scripts/deps.sh for all 4 ABIs). Reproduces the old CircleCI ubuntu:20.04 recipe.
# Manual-trigger only (heavy: NDK r13b + ffmpeg/x264/vpx/opus/sodium + toxcore per ABI).
# ABI build order in deps.sh: armeabi -> arm64-v8a -> x86 -> x86_64. arm64-v8a (needed for
# emulator + Redmi QA) is done ~halfway, so even a late-ABI timeout still yields it via the
# always() artifact upload.

on:
  workflow_dispatch:
    inputs:
      instrument:
        description: "Add #201 KHQ201 resend-timing logcat instrumentation (QA measurement build)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    container:
      # KHANDAQ (audit 2026-08-21, K-05 adjacent): pinned by digest. This job builds
      # libjni-c-toxcore.so, which is committed into app/nativelibs/ and packaged into the shipped
      # APK — so this container is upstream of the release artifact, and it was a floating tag with
      # an unversioned apt-get list. That is a strictly larger unpinned surface than the SDK
      # provisioning K-06 is about, and it produces no attestation of its own.
      #
      # `ubuntu:20.04` as of 2026-08-21. The tag is kept alongside the digest for readability.
      # NOTE for the owner: 20.04 is past its standard end of life. The digest pin makes the build
      # reproducible; it does not make the base supported. Moving to 22.04/24.04 changes the
      # toolchain that compiles the shipped .so and needs a real ABI check, so it is deliberately
      # NOT bundled into a pinning commit.
      image: ubuntu:20.04@sha256:8feb4d8ca5354def3d8fce243717141ce31e2c428701f6682bd2fafe15388214
    env:
      HOME: /root
      DEBIAN_FRONTEND: noninteractive
      KHQ201_INSTRUMENT: ${{ inputs.instrument && '1' || '' }}
    steps:
      - name: install build deps (same set as the old CircleCI recipe + a few for the native build)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            clang cmake libconfig-dev libgtest-dev ninja-build pkg-config \
            zip unzip grep file ca-certificates autotools-dev autoconf automake \
            git bc wget curl rsync make libtool \
            ssh gzip tar xz-utils coreutils perl yasm nasm \
            python3 python-is-python3 \
            openjdk-11-jdk openjdk-11-jre libncurses5
          # deps.sh calls python3 for the patch scripts; keep a python shim too
          ln -sf /usr/bin/python3 /usr/bin/python || true

      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: stage source into /root/work (scripts hard-code _HOME_=/root/work)
        run: |
          set -eux
          mkdir -p /root/work
          cp -a khandaq-android-trifa/. /root/work/
          mkdir -p /root/work/deploy
          mkdir -p /root/.android
          touch /root/.android/repositories.cfg
          touch /root/.android/debug.keystore
          echo "=== patches present in /root/work/patches ==="
          ls -1 /root/work/patches/
          echo "=== confirm #201 media-resend patch is wired into deps.sh ==="
          grep -c apply_khandaq_media_resend.py /root/work/circle_scripts/deps.sh
          echo "=== confirm audit F2 NGC-video chroma patch is wired into deps.sh (4 ABIs) ==="
          # wiring only -- that the patch actually RAN is checked against the cloned trees after the build
          f2_sites=$(grep -c apply_khandaq_toxav_ngc_chroma.py /root/work/circle_scripts/deps.sh)
          echo "wired at $f2_sites site(s)"
          [ "$f2_sites" -eq 4 ]

      - name: build native deps + patched toxcore + libjni-c-toxcore.so (deps.sh)
        id: build
        continue-on-error: true
        working-directory: /root/work
        run: |
          set -x
          mkdir -p build_dir
          cd build_dir
          bash ../circle_scripts/deps.sh ""

      - name: list produced artefacts
        if: always()
        run: |
          echo "=== artefacts tree ==="
          find /root/work/artefacts -name '*.so' -exec ls -hal {} \; 2>/dev/null || true
          echo "=== any libjni-c-toxcore.so anywhere ==="
          find /root/work -name 'libjni-c-toxcore.so' -exec sh -c 'echo "$1:"; file "$1"' _ {} \; 2>/dev/null || true

      - name: upload libjni-c-toxcore.so (all ABIs that finished)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: libjni-c-toxcore-so-201
          if-no-files-found: warn
          path: |
            /root/work/artefacts/android/libs/**/libjni-c-toxcore.so

      - name: fail the job unless arm64 .so was produced AND the patched trees carry the audit-F2 guard
        if: always()
        run: |
          rc=0
          # the build step is continue-on-error (so a late-ABI failure still uploads the earlier ABIs);
          # this gate is what turns "deps.sh died" into a red job.
          if [ -f /root/work/artefacts/android/libs/arm64-v8a/libjni-c-toxcore.so ]; then
            echo "arm64-v8a libjni-c-toxcore.so produced OK"
          else
            echo "ERROR: no arm64-v8a .so produced"
            rc=1
          fi
          # grepping deps.sh only proves the wiring; grep the CLONED toxcore trees to prove the patch ran.
          # deps.sh clones per ABI into /root/work/{build,arm64_build,x86_build,x86_64_build}/c-toxcore.
          trees=0
          for f in /root/work/*build*/c-toxcore/toxav/toxav.c; do
            [ -f "$f" ] || continue
            trees=$((trees+1))
            if grep -q 'KHANDAQ (audit F2)' "$f"; then
              echo "audit-F2 chroma guard present in $f"
            else
              echo "ERROR: audit-F2 chroma guard MISSING in $f -- .so would ship the overflow"
              rc=1
            fi
          done
          echo "checked $trees patched toxcore tree(s)"
          if [ "$trees" -eq 0 ]; then
            echo "ERROR: no cloned c-toxcore tree found -- deps.sh never reached the patch step"
            rc=1
          fi
          exit $rc
