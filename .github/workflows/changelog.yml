name: Changelog

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# KHANDAQ (security P-2): default to read-only. Only the push-triggered `commit` job below is granted
# contents: write (it auto-commits the regenerated changelog). The PR path (`verify`) stays read-only
# so a pull request can never obtain a write token via this workflow.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Generate changelog.json from git
        run: python3 scripts/generate-changelog.py

      - name: Verify changelog.json on pull request
        if: github.event_name == 'pull_request'
        run: python3 scripts/changelog-content-diff.py --verify

  commit:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Generate changelog.json from git
        run: python3 scripts/generate-changelog.py

      - name: Auto-update changelog.json on master (signed via GitHub API)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Content, not bytes -- same reason as the verify job. `git diff --quiet` was true on
          # every push, because generated_at always moved, so this job committed a new
          # "chore: regenerate changelog.json" on every single push to master whether or not the
          # changelog had actually changed.
          if ! python3 scripts/changelog-content-diff.py; then
            echo "changelog.json is up to date"
            exit 0
          fi
          # KHANDAQ (audit A17): create the commit through the GitHub API (createCommitOnBranch)
          # instead of `git push`, so GitHub SIGNS it (shows Verified). This lets the branch require
          # signed commits with NO bypass for this bot -- the auto-changelog commit is itself signed.
          contents="$(base64 -w0 web/changelog.json)"
          head_oid="$(git rev-parse HEAD)"
          gh api graphql \
            -f query='mutation($repo:String!,$branch:String!,$oid:GitObjectID!,$path:String!,$contents:Base64String!,$msg:String!){createCommitOnBranch(input:{branch:{repositoryNameWithOwner:$repo,branchName:$branch},message:{headline:$msg},expectedHeadOid:$oid,fileChanges:{additions:[{path:$path,contents:$contents}]}}){commit{oid}}}' \
            -f repo="${GITHUB_REPOSITORY}" \
            -f branch="${GITHUB_REF_NAME}" \
            -f oid="${head_oid}" \
            -f path="web/changelog.json" \
            -f contents="${contents}" \
            -f msg="chore: regenerate changelog.json from git"
