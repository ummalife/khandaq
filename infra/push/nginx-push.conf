limit_req_zone $binary_remote_addr zone=khandaq_push:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=khandaq_push_conn:10m;

# KHANDAQ (security V-3): the access log must not persist secret-bearing query params in plaintext.
# KHANDAQ (audit2 #4): the old pattern only matched key=/auth=/ts=, so an UNSIGNED legacy wake
# (?id=<FCM registration token>&from=<pubkey>) was logged verbatim — and an FCM token is a targeting
# secret (anyone holding it can push to that device). Redact EVERY query string: the path alone is all
# the operational signal the log needs, and no arg on this vhost is safe to persist.
map $request_uri $push_log_uri {
    "~^(?<pathonly>[^?]*)\?" "$pathonly?[REDACTED]";
    default                  $request_uri;
}
# KHANDAQ (audit3): $http_version is not an nginx variable — it resolved to the (nonexistent)
# "Http-Version" REQUEST HEADER, so every line read "HTTP/-" instead of the protocol. Since the error
# log no longer carries request-context entries (see the TLS vhost below), this access log is now the
# only per-request record, so it must not throw away the protocol. $server_protocol is the real one.
log_format push_redacted '$remote_addr - [$time_local] "$request_method $push_log_uri $server_protocol" '
                         '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

# KHANDAQ (audit A3): port 80 serves ONLY the ACME challenge and 301-redirects everything else to
# HTTPS — the relay carries auth signatures + FCM tokens and must never be reachable in cleartext.
server {
    listen 80;
    listen [::]:80;
    server_name push.khandaq.org;

    # KHANDAQ (audit3 #2): without these the vhost inherited the GLOBAL access_log (combined format,
    # raw $request) — so a client that hit http:// instead of https:// had its full wake URI, FCM
    # token and all, written verbatim to /var/log/nginx/access.log before the 301. Same redacted
    # format + same error-log policy as the TLS vhost below.
    access_log /var/log/nginx/push_khandaq_access.log push_redacted;
    error_log /var/log/nginx/push_khandaq_error.log crit;

    location /.well-known/acme-challenge/ {
        root /var/www/push.khandaq.org;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name push.khandaq.org;

    ssl_certificate /etc/letsencrypt/live/push.khandaq.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/push.khandaq.org/privkey.pem;
    # KHANDAQ (audit A3): modern TLS only + HSTS so browsers/clients never downgrade to cleartext.
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    access_log /var/log/nginx/push_khandaq_access.log push_redacted;
    # KHANDAQ (audit3 #1): the ERROR log is not redactable — nginx writes the raw request line
    # (`request: "GET /toxfcm/fcm.php?id=<FCM token>&from=… HTTP/1.1"`) into every request-context
    # entry, and the log_format/map above only govern the ACCESS log. At the old `warn` threshold
    # every [error]-level entry landed here WITH the token: rate-limit rejections (limit_req/
    # limit_conn log at `error` by default) and upstream failures (connect refused / timed out) are
    # exactly the entries that fire under load or during an outage. Raise the threshold to `crit` so
    # no request-context entry is written; [crit]+ events on this vhost (TLS handshake, worker/
    # resource failures) are emitted before or independently of a request line, so they carry no
    # query. Diagnostics do not disappear: the redacted access log still records the status of every
    # request (429 = rate-limited — this host sets `limit_req_status 429` in nginx.conf, NOT the 503
    # default; 502/504 = upstream down; 413 = body too large), and the relay's own reasons stay in
    # `docker compose logs khandaq-push-relay`.
    error_log /var/log/nginx/push_khandaq_error.log crit;

    client_max_body_size 64k;

    # KHANDAQ (audit round 3, F-10): the telemetry half of the health endpoint is not for the public.
    #
    # /health used to publish auth_mode, the epoch count, the service-account state and the whole
    # auth_adoption summary to anyone who asked. Aggregate — no identifiers — but polling it once a
    # minute and differencing the outcome buckets yields a live request rate and a daily and weekly
    # activity profile for the entire user base, and no shipped client signs yet, so nearly all of
    # that traffic lands in one bucket. The app has no before_request hook, so the gate belongs here.
    #
    # /health stays public and answers {"status":"ok"} — enough for an uptime probe and nothing else.
    # This block must come BEFORE `location /`, and being an exact match it wins regardless.
    location = /health/detail {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        limit_req zone=khandaq_push burst=10 nodelay;
        limit_conn khandaq_push_conn 20;
        # KHANDAQ (audit3 #1): belt-and-braces — pin the two limiters BELOW the error_log threshold
        # explicitly, so their token-bearing entries stay suppressed even if someone later lowers
        # error_log back to warn/error. Rate-limit visibility lives in the access log (status 429).
        limit_req_log_level info;
        limit_conn_log_level info;

        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }
}
