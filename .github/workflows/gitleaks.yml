# KHANDAQ (audit A18): secret scanning.
# On push/PR we scan ONLY the newly-introduced commits — a fast, forward-looking gate that blocks NEW
# secrets without failing on pre-existing history (the historical Firebase key is tracked separately as
# audit A21 and can only be purged by a history rewrite). The FULL-history sweep runs on a weekly
# schedule and on manual dispatch, so an audit can still surface anything already in history.
name: gitleaks

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC — full-history audit

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0   # full history available; the range below decides what is actually scanned
      - name: Run gitleaks (pinned)
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          VER=8.18.4
          # KHANDAQ (audit: CI supply chain): the version was pinned but the DOWNLOAD was not
          # verified, so anything that could answer for the release URL — a compromised release
          # asset, a MITM on the runner, a re-tagged release — executed as root in CI with the
          # repository checked out. Pin the digest too and check it BEFORE extraction, so a
          # mismatch fails the job instead of running an unknown binary.
          # Digest source: gitleaks_8.18.4_checksums.txt of the same release; independently
          # re-derived from the downloaded artifact (sha256sum) before being written here.
          SHA256=ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d
          curl -sSL --fail --proto '=https' --tlsv1.2 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            -o gitleaks.tgz
          echo "${SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          # Decide the commit range to scan.
          case "$EVENT" in
            schedule|workflow_dispatch)
              RANGE="--all" ;;                              # full-history audit
            pull_request)
              RANGE="${PR_BASE}..${SHA}" ;;                 # only the PR's commits
            *)
              if [ -z "${BEFORE:-}" ] || echo "${BEFORE:-}" | grep -qE '^0+$'; then
                RANGE="${SHA}~1..${SHA}"                    # new branch / first push: just the tip
              else
                RANGE="${BEFORE}..${SHA}"                   # only the pushed commits
              fi ;;
          esac
          echo "gitleaks range: ${RANGE}"
          ./gitleaks detect --source . --log-opts="${RANGE}" --redact --no-banner
