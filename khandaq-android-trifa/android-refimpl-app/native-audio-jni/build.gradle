
plugins {
    id 'com.android.library'
}

repositories {
    google()
    mavenCentral()
    maven {
        url "https://jitpack.io"
    }
}

android {
    compileSdkVersion = 32
    buildToolsVersion = '30.0.3'
    compileOptions.encoding = 'UTF-8'

    packagingOptions {
        exclude 'LICENSE.txt'
        //
        doNotStrip "*/armeabi-v7a/*.so"
        doNotStrip "*/arm64-v8a/*.so"
    }

    defaultConfig {
        minSdkVersion 19
        //noinspection ExpiredTargetSdkVersion
        targetSdkVersion 29

        externalNativeBuild {
            cmake {
                cFlags "-g -O3"
                cppFlags "-g -O3"
            }

            ndk {
                // Specifies the ABI configurations of your native
                // libraries Gradle should build and package with your APK.
                abiFilters 'x86', 'x86_64', 'armeabi-v7a', 'arm64-v8a'
            }
        }
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    android {
        ndkVersion "23.2.8568313"
    }

    externalNativeBuild {
        cmake {
            // KHANDAQ: pinned, not left to AGP's default. With no version here AGP silently picked
            // its own (3.22.1) and the SDK auto-downloaded it mid-build, which is exactly the
            // unpinned-component case scripts/ci-android-toolchain.sh refuses to attest. 3.22.1 is
            // the version that was already being used, so the compiled output does not change.
            version "3.22.1"
            path 'src/main/cpp/CMakeLists.txt'
        }
    }
    ndkVersion "23.2.8568313"
    namespace 'com.zoffcc.applications.nativeaudio'
}
