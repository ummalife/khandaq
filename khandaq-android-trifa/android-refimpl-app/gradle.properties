# Project-wide Gradle settings.

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
android.enableJetifier=true
# KHANDAQ: bcprov-jdk18on 1.85 (Robolectric's, unit tests only) is a multi-release jar with Java 25
# classes, which Jetifier cannot read (Unsupported class file major version 69). It has no
# support-library references to rewrite, so Jetifier leaves it alone.
android.jetifier.ignorelist=bcprov-jdk18on
android.useAndroidX=true
noWitness=_internal_aapt2_binary
# org.gradle.jvmargs=-Xmx1536m
org.gradle.jvmargs=-Xmx2560M
# org.gradle.jvmargs=-Xmx2560M -DsocksProxyHost=127.0.0.1 -DsocksProxyPort=5555
kotlin.jvm.target.validation.mode=IGNORE
android.defaults.buildfeatures.buildconfig=true
android.nonTransitiveRClass=false
android.nonFinalResIds=false