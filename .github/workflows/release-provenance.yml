# KHANDAQ (audit A19): build the Android release APK in CI and produce verifiable SLSA build provenance
# via GitHub OIDC (no secret needed for the attestation). Runs on demand + on release tags only, so it
# adds no per-push load. If the upload keystore is supplied as repo secrets, the built APK is the SIGNED
# shippable artifact; otherwise it is an unsigned reference build. Either way anyone can run
#   gh attestation verify <apk> -R ummalife/khandaq
# to prove the artifact was built by this workflow from a specific commit (reproducible provenance).
name: release-provenance

on:
  workflow_dispatch:
  push:
    tags:
      - 'android-v*'
      - 'v*'

permissions:
  contents: read
  id-token: write        # OIDC token used to sign the provenance
  attestations: write    # record the attestation on the repo

jobs:
  build-attest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install NDK + compile SDK platform
        run: |
          set -euo pipefail
          SDKMGR="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | sudo "$SDKMGR" --install "ndk;21.0.6113669" --sdk_root="${ANDROID_SDK_ROOT}" || true
          yes | sudo "$SDKMGR" --install "platforms;android-36" --sdk_root="${ANDROID_SDK_ROOT}" || true

      - name: Provide google-services.json (real from secret, else placeholder for the build)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          f=khandaq-android-trifa/android-refimpl-app/app/google-services.json
          # google-services.json is gitignored (audit A21 — it held the committed Firebase key), so it is
          # absent on a fresh CI checkout. Use the real config if the owner supplies it as a secret (that
          # yields the SHIPPABLE build); otherwise write a placeholder with the correct package so the
          # google-services plugin is satisfied and we can still build an unsigned REFERENCE artifact to
          # attest. The placeholder is created in the runner only, never committed.
          if [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
            printf '%s' "${GOOGLE_SERVICES_JSON}" > "$f"
            echo "using google-services.json from secret"
          elif [ ! -f "$f" ]; then
            cat > "$f" <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "khandaq-messenger",
              "storage_bucket": "khandaq-messenger.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": { "package_name": "com.khandaq.messenger" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "PLACEHOLDER_NOT_A_REAL_KEY_reference_build_only" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          JSON
            echo "wrote placeholder google-services.json (unsigned reference build)"
          fi

      - name: Verify committed dependency pins (gradle witness) — never regenerate them here
        run: |
          set -euo pipefail
          cd khandaq-android-trifa/android-refimpl-app
          chmod +x ./gradlew
          w=app/witness.gradle
          # audit2 #2: pinChecksums only walks the assertions it finds, so an empty or truncated witness file
          # would make the gate pass vacuously. Require the committed pin list to still be there.
          n=$(grep -cE "^[[:space:]]*'[^']+:[0-9a-f]{64}'," "$w" || true)
          echo "committed dependency pins: $n"
          if [ "$n" -lt 100 ]; then
            echo "::error::witness.gradle holds only $n pins - refusing to build/attest a release from an unpinned tree" >&2
            exit 1
          fi
          # audit2 #2: this step used to run "calculateChecksums || true", which emptied and rewrote witness.gradle
          # from whatever this runner had just downloaded - i.e. a substituted maven artifact would have been
          # re-pinned, built, signed and attested. The release path must ONLY verify, and must fail on mismatch.
          # A legitimate dependency bump is a reviewed commit of app/witness.gradle (see gradle_witness_ng.gradle
          # header / the manual "witness-checksums-update" workflow).
          ./gradlew --no-daemon -PrunWitnessChecker=true :app:pinChecksums

      - name: Build release APK
        env:
          KHANDAQ_UPLOAD_STORE_FILE: ${{ secrets.KHANDAQ_UPLOAD_STORE_FILE }}
          KHANDAQ_UPLOAD_PASSWORD: ${{ secrets.KHANDAQ_UPLOAD_PASSWORD }}
          KHANDAQ_UPLOAD_ALIAS: ${{ secrets.KHANDAQ_UPLOAD_ALIAS }}
        run: |
          set -euo pipefail
          cd khandaq-android-trifa/android-refimpl-app
          chmod +x ./gradlew
          ARGS=""
          if [ -n "${KHANDAQ_UPLOAD_STORE_FILE:-}" ]; then
            ARGS="-PKHANDAQ_UPLOAD_STORE_FILE=${KHANDAQ_UPLOAD_STORE_FILE} -PKHANDAQ_UPLOAD_PASSWORD=${KHANDAQ_UPLOAD_PASSWORD} -PKHANDAQ_UPLOAD_ALIAS=${KHANDAQ_UPLOAD_ALIAS}"
          fi
          ./gradlew --no-daemon :app:assembleRelease ${ARGS}
          find app/build/outputs/apk/release -name '*.apk'

      # audit2 #2: belt and braces - if anything in the build graph ever rewrites the pins again, the artifact
      # we are about to sign was not built against the reviewed pin list, so stop before attesting.
      - name: Assert the dependency pins were not rewritten during the build
        run: |
          set -euo pipefail
          git diff --exit-code -- khandaq-android-trifa/android-refimpl-app/app/witness.gradle

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd khandaq-android-trifa/android-refimpl-app/app/build/outputs/apk/release
          sha256sum *.apk | tee SHA256SUMS.txt

      - name: Attest build provenance (SLSA, via OIDC)
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1
        with:
          subject-path: khandaq-android-trifa/android-refimpl-app/app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: khandaq-android-release
          path: |
            khandaq-android-trifa/android-refimpl-app/app/build/outputs/apk/release/*.apk
            khandaq-android-trifa/android-refimpl-app/app/build/outputs/apk/release/SHA256SUMS.txt
