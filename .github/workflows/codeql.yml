# KHANDAQ (re-review 2026-08-22, KQ-10) — the broad scan the targeted gates cannot be.
#
# This repository has a lot of security regression tests, and they are good ones: they pin the exact
# defects previous audits found. That is also their limit — every one of them is shaped by a bug
# somebody already understood. A general scanner is the thing that can flag a class nobody has hit
# yet: command injection, path traversal, unsafe deserialization, tainted URL and file handling.
#
# ADVISORY FOR THE FIRST CYCLE, as the review asks. Results land in the repository's code-scanning
# view; this workflow is deliberately NOT in the required-checks ruleset yet. Turning a brand-new
# scanner into a merge blocker on an inherited codebase produces a wall of findings on day one and a
# team that switches it off on day two. The plan is to triage, tune, and then promote the
# high-confidence security queries to blocking.
name: codeql

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly, because a new query release finds new things in unchanged code.
    - cron: '0 6 * * 2'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # java-kotlin covers the Android client, python the relay and every script under scripts/,
        # javascript the website, actions the workflows themselves.
        #
        # c-cpp added 2026-08-23 (RR2-12). It used to be excluded on the grounds that CodeQL needs
        # to observe a real compilation and the desktop needs a Qt toolchain this runner lacks —
        # true of the desktop GUI, and beside the point for the code that matters. The native attack
        # surface is toxcore: DHT, onion, messenger, group chats and toxav, i.e. every parser that
        # touches bytes from another peer. It ships as a single amalgamation with a Makefile of its
        # own, needs no Qt, and compiles clean (verified: 90k lines, zero errors), so CodeQL can
        # watch exactly the compilation that produces what users run.
        language: [java-kotlin, python, javascript-typescript, actions, c-cpp]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Only for c-cpp: the libraries the amalgamation links against. Everything else uses
      # build-mode none and needs nothing installed.
      - name: Install the native build dependencies
        if: matrix.language == 'c-cpp'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libsodium-dev libopus-dev libvpx-dev libx264-dev \
            libavcodec-dev libavutil-dev pkg-config

      - name: Initialise CodeQL
        uses: github/codeql-action/init@6d786de4d6f3531a740e445b53a42b622bbbace8 # v3 (codeql-bundle-v2.26.3)
        with:
          languages: ${{ matrix.language }}
          # build-mode none keeps java-kotlin from needing the Android SDK and a full Gradle build,
          # which would put a 20-minute build on every pull request for an advisory scan.
          build-mode: ${{ matrix.language == 'c-cpp' && 'manual' || 'none' }}
          queries: security-extended
          # Excludes security/sast-fixtures/, which is deliberately vulnerable by construction.
          config-file: ./.github/codeql/codeql-config.yml

      # The compilation CodeQL observes. One translation unit, the whole of toxcore.
      - name: Build toxcore for CodeQL
        if: matrix.language == 'c-cpp'
        run: |
          set -euo pipefail
          cd khandaq-desktop/buildscripts/toxcore/amalgamation
          cc -c -o libtoxcore.o toxcore_amalgamation.c -O1 -fPIC -pthread \
            $(pkg-config --cflags libsodium opus vpx libavcodec libavutil x264)
          ls -l libtoxcore.o

      - name: Analyse
        uses: github/codeql-action/analyze@6d786de4d6f3531a740e445b53a42b622bbbace8 # v3 (codeql-bundle-v2.26.3)
        with:
          category: /language:${{ matrix.language }}
