    # KHANDAQ-MANAGED-BEGIN — everything between the markers is replaced wholesale by
    # scripts/deploy-site.sh from infra/nginx/khandaq-static-site.locations.conf. Do not edit
    # this region on the server; the edit is silently discarded on the next deploy.
    # Legacy Element Web UI backed up under /var/www/backups/ (see deploy-site.sh)
    location = /messenger {
        include /etc/nginx/snippets/khandaq-security-headers.conf;
        return 301 https://$host/;
    }
    location ^~ /messenger/ {
        include /etc/nginx/snippets/khandaq-security-headers.conf;
        return 301 https://$host/;
    }

    # KHANDAQ (re-audit 2026-08-22, W-01): every location includes the generated header baseline.
    # nginx's add_header does NOT merge across levels — the moment a location adds one header of its
    # own it stops inheriting all of them — so a baseline set once at server level would be present
    # on exactly the responses that set no cache header and missing everywhere else. Including it
    # per-location is verbose, and it is the only arrangement that actually holds.

    location ^~ /downloads/ {
        include /etc/nginx/snippets/khandaq-security-headers.conf;
        alias /var/www/khandaq-site/downloads/;
        index index.html;
        add_header Cache-Control "public, max-age=3600" always;
        autoindex off;
    }

    location = /robots.txt {
        include /etc/nginx/snippets/khandaq-security-headers.conf;
        root /var/www/khandaq-site;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location = /sitemap.xml {
        include /etc/nginx/snippets/khandaq-security-headers.conf;
        root /var/www/khandaq-site;
        add_header Content-Type application/xml always;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # KHANDAQ (re-audit 2026-08-22, W-03): RFC 9116 discovery endpoint. Explicit content type —
    # a security.txt served as application/octet-stream is not a valid one, and the post-deploy
    # check asserts the type as well as the status.
    location = /.well-known/security.txt {
        include /etc/nginx/snippets/khandaq-security-headers.conf;
        root /var/www/khandaq-site;
        default_type text/plain;
        add_header Content-Type "text/plain; charset=utf-8" always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location ^~ /.well-known/ {
        include /etc/nginx/snippets/khandaq-security-headers.conf;
        root /var/www/khandaq-site;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location /assets/ {
        include /etc/nginx/snippets/khandaq-security-headers.conf;
        root /var/www/khandaq-site;
        add_header Cache-Control "public, max-age=604800" always;
    }

    location = /style.css {
        include /etc/nginx/snippets/khandaq-security-headers.conf;
        root /var/www/khandaq-site;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /changelog {
        include /etc/nginx/snippets/khandaq-security-headers.conf;
        root /var/www/khandaq-site;
        try_files /changelog.html =404;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /changelog.json {
        include /etc/nginx/snippets/khandaq-security-headers.conf;
        root /var/www/khandaq-site;
        default_type application/json;
        add_header Cache-Control "public, max-age=600" always;
    }

    # KHANDAQ (re-audit 2026-08-22, W-02): the manifest is what an outside checker compares the
    # published pages against, so it must never be cached long enough to outlive a deploy.
    location = /release-manifest.json {
        include /etc/nginx/snippets/khandaq-security-headers.conf;
        root /var/www/khandaq-site;
        default_type application/json;
        add_header Cache-Control "no-store" always;
    }

    location = /404.html {
        include /etc/nginx/snippets/khandaq-security-headers.conf;
        root /var/www/khandaq-site;
        internal;
    }

    # `location /` stays LAST in this file. deploy-site.sh's patcher used to find the end of the
    # managed region by walking to the close of `location /`, so a block placed after it survived
    # the next patch and nginx refused to start on "duplicate location". The BEGIN/END markers below
    # make that heuristic unnecessary, and the ordering is kept anyway: two independent reasons not
    # to get this wrong are better than one.
    location / {
        include /etc/nginx/snippets/khandaq-security-headers.conf;
        root /var/www/khandaq-site;
        # KHANDAQ (re-audit 2026-08-22, W-01): a real 404 for unknown paths. This used to fall back
        # to /index.html, so every mistyped URL answered 200 with the homepage — search engines
        # indexed junk paths as real pages and a broken link was indistinguishable from a working
        # one. Every internal link on the site is either a file or one of the two pretty URLs
        # handled above, so nothing depended on the fallback.
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=300" always;
        error_page 404 /404.html;
    }
    # KHANDAQ-MANAGED-END
