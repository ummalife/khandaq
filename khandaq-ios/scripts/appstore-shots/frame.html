<!doctype html>
<html lang="{{lang}}" dir="{{dir}}" data-theme="{{theme}}">
<head>
<meta charset="utf-8">
<title>Khandaq App Store frame</title>
<style>
{{fonts}}

/* The design system's colour tokens (design/system/dist/tokens.css): data-theme picks light or dark,
   the same switch the site uses, so a frame follows the theme of the capture inside it. */
{{tokens}}

/* Canvas and phone geometry of the store this frame is rendered for (render.py, PROFILES). */
{{geometry}}

:root {
  --frame-font: {{font_stack}};
  /* The phone is drawn, not photographed: an ink body in the light frame, a black one with a
     strong line around it in the dark frame, where ink on bg would disappear. */
  --phone-body: var(--kq-ink);
  --phone-edge: transparent;
}

:root[data-theme="dark"] {
  --phone-body: var(--kq-fixed-black);
  --phone-edge: var(--kq-line-strong);
}

html, body {
  margin: 0;
  width: var(--canvas-w);
  height: var(--canvas-h);
  overflow: hidden;
  background: var(--kq-bg);
}

.frame {
  position: relative;
  width: var(--canvas-w);
  height: var(--canvas-h);
  overflow: hidden;
  background: var(--kq-bg);
}

.copy {
  position: absolute;
  top: 0;
  inset-inline: var(--copy-inline);
  height: var(--copy-h);
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: var(--copy-gap);
  text-align: start;
}

h1 {
  margin: 0;
  font-family: var(--frame-font);
  font-weight: 600;
  font-size: var(--h1-size);
  line-height: 1.08;
  letter-spacing: -0.015em;
  color: var(--kq-ink);
  text-wrap: balance;
}

p {
  margin: 0;
  max-width: var(--p-max);
  font-family: var(--frame-font);
  font-weight: 400;
  font-size: var(--p-size);
  line-height: 1.38;
  color: var(--kq-ink-2);
  text-wrap: pretty;
}

/* The capture fills the screen at its own aspect ratio, inside a body `--bezel` thick. */
.phone {
  position: absolute;
  top: var(--phone-top);
  left: var(--phone-left);
  width: var(--phone-w);
  height: var(--phone-h);
  border-radius: var(--phone-radius);
  background: var(--phone-body);
  box-shadow: 0 0 0 3px var(--phone-edge);
}

.screen {
  position: absolute;
  inset: var(--bezel);
  border-radius: var(--screen-radius);
  overflow: hidden;
  background: var(--kq-fixed-black);
}

.screen img {
  display: block;
  width: 100%;
  height: 100%;
}

/* Arabic letters need taller lines than Latin or Cyrillic at the same size, and no tracking. */
:root[dir="rtl"] h1 { letter-spacing: 0; line-height: 1.3; font-size: var(--rtl-h1-size); }
:root[dir="rtl"] p { line-height: 1.55; font-size: var(--rtl-p-size); }
</style>
</head>
<body>
<div class="frame">
  <div class="copy">
    <h1>{{title}}</h1>
    <p>{{subtitle}}</p>
  </div>
  <div class="phone"><div class="screen"><img src="{{shot}}" alt=""></div></div>
</div>
</body>
</html>
