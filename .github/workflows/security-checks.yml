# KHANDAQ (audit 2026-08-21) — security controls that decay with the calendar rather than with a diff.
#
# Everything else in .github/workflows fails when a change is wrong. These checks fail when NOTHING
# changes for long enough: a pinned CA-anchor set that expires on a fixed date, a bundled crypto
# runtime that reaches end-of-life. Neither has a commit that introduces the problem, so neither can
# be caught by a push-triggered gate alone — hence the schedule.
#
# They must all be offline and dependency-free: no network at build time, no SDK, no Xcode, no Qt.
# `ubuntu-24.04` ships the python3 they need.
name: security-checks

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Mondays 07:00 UTC. Offset from the gitleaks sweep so a red Monday points at one thing.
    - cron: '0 7 * * 1'

permissions:
  contents: read

jobs:
  push-ca-anchors:
    # KHANDAQ (K-08): Android's <pin-set expiration="..."> for push.khandaq.org deliberately lapses,
    # after which Android reverts to ordinary system-CA validation. That is an anti-brick valve, not a
    # bug — the bug is that nothing enforced the refresh, and that the same policy is maintained by
    # hand in two languages with the expiry written out three times.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: push.khandaq.org CA anchors — expiry window and Android/iOS parity
        run: python3 scripts/check-push-ca-anchors.py

  relay-dependencies:
    # KHANDAQ (K-05): pinning is what makes the relay build reproducible, and also what makes it go
    # stale. `requests==2.32.3` was correct when it was written and had collected two advisories by
    # the time it was audited, with no commit in between for a push-triggered gate to fire on.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Push-relay Python pins — known advisories (OSV)
        run: python3 scripts/check-python-deps.py

  ios-bundler:
    # KHANDAQ (K-07): khandaq-ios pins CocoaPods and fastlane in a committed Gemfile.lock, but a lock
    # only binds the build if the build goes through Bundler — and no CI job here builds iOS, so
    # without a text check on Linux nothing at all holds the property.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: CocoaPods/fastlane must be invoked through Bundler
        run: python3 scripts/check-ios-bundler.py

  desktop-bundled-deps:
    # KHANDAQ (K-04): the desktop bundles Qt 5.12.12 and OpenSSL 1.1.1w. 1.1.1 has had no public
    # security fixes since 2023-09-11 — a date that passed with no commit for a push-triggered gate
    # to fire on, which is why this is here and on a schedule. It also catches inventory drift, the
    # way windows-build.yaml's prose comment had already drifted from the download scripts.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Bundled desktop dependencies — EOL, security floors and inventory drift
        run: python3 scripts/check-bundled-deps-eol.py --warn-days 180
      # KHANDAQ (internal audit 2026-08-22): the inventory listed components as shipping on macOS
      # while every pin it names is a Windows cross-build script, and the SBOM repeated the claim.
      - name: The bundled inventory must not claim unpinned platforms
        run: python3 scripts/check-bundled-deps-platforms.py

  release-metadata:
    # KHANDAQ (re-audit 2026-08-21, R-07): the package name, the version and the iOS build number were
    # written by hand in the site, the README and the release notes, and they drifted — the iOS build
    # number appeared as three different values in three places, two of them on the same page. Not a
    # vulnerability, but it defeats provenance checking specifically: a user who compares what they are
    # installing against what was published finds the numbers disagree and stops comparing.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Published metadata must match the build files
        run: python3 scripts/check-release-metadata.py
      # KHANDAQ (re-review 2026-08-23, KQ-R1): "the repository is green" and "users are protected"
      # became different statements — out-of-bounds reads were closed on master while 0.2.42 stayed
      # in the stores. This counts the gap. It warns rather than fails here on purpose: failing every
      # PR the moment one security fix merges would block the second one.
      - name: Count security fixes waiting for a release
        run: python3 scripts/check-release-freshness.py
      # KHANDAQ (re-review v2 2026-08-22, RR2-13): the privacy policy is part of the control surface.
      # It listed three permissions the app no longer requests and stated the store builds carry no
      # signing key, which stopped being true with 0.2.42. Neither is visible by reading the page.
      - name: Privacy and security claims must match the app and the release
        run: python3 scripts/check-policy-claims.py
      # KHANDAQ (internal audit 2026-08-22): the native library is downloaded, not committed. These
      # are the digests that were reviewed.
      - name: The native library must match its committed digests
        run: python3 scripts/check-native-lib-pins.py
      # KHANDAQ (2026-08-23): 31 of the 32 ffmpeg advisories are waived as unreachable, and every one
      # of those arguments rests on the same measured fact — the binary links exactly one ffmpeg
      # decoder and nothing else. Enabling one more codec is a reasonable thing to do and would make
      # a pile of waivers quietly false, so the fact is held here rather than assumed.
      - name: The ffmpeg surface must stay the one the waivers were argued against
        run: python3 scripts/check-ffmpeg-surface.py
      # KHANDAQ (deep review 2026-08-23, RR3-11): the bootstrap lists are DHT trust anchors, and they
      # are edited by scripts no workflow calls. Three retired anchors were still shipping.
      - name: No client may ship a retired DHT anchor
        run: python3 scripts/check-bootstrap-nodes.py

  compose-parses:
    # KHANDAQ (production deploy 2026-08-21): a compose file that docker cannot load is an outage with
    # no tools left to fix it — no `logs`, no `ps`, no `restart`, no rollback by compose, on a host
    # where the deploy has already uploaded it. This caught nothing in review and everything at the
    # first real deploy: a `${VAR:?message}` guard whose message contained ": " made YAML parse the
    # entry as a mapping, and compose rejected the whole file.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Compose environment entries must be plain strings
        run: python3 scripts/check-compose-env-strings.py
      # KHANDAQ (re-review 2026-08-22, KQ-01): a release must carry the relay state it shipped
      # against. Only the presence and shape are checked here — refreshing the numbers needs the
      # production host, which CI deliberately cannot reach.
      - name: A release must carry recorded push-relay evidence
        run: python3 scripts/record-push-release-evidence.py --check
      # Same family, found the same way: an unquoted heredoc runs backticks on the LOCAL machine, so a
      # comment explaining a bug executed `ssh bash -s` on the workstation in the middle of a deploy.
      - name: No unescaped backticks inside unquoted heredocs
        run: python3 scripts/check-shell-heredocs.py
      # KHANDAQ (re-audit 2026-08-22): the trap that had been silently ending deploy-site.sh before
      # it uploaded anything — which is why the published site had drifted a release behind.
      - name: No silent set -e exits in deploy/ci/signing scripts
        run: python3 scripts/check-shell-set-e-traps.py
      # KHANDAQ (re-review v2 2026-08-22, RR2-10): a mutable @v3 tag in a workflow holding
      # security-events:write is a step somebody else can change without a diff here.
      - name: Every third-party action must be pinned to a commit SHA
        run: python3 scripts/check-action-pinning.py
      # KHANDAQ (internal audit 2026-08-22, H-01): the deploy fetched already-published artifacts
      # from the production web server and signed whatever did not verify — so a swapped binary got
      # a release signature on the next ordinary deploy. This proves the signer refuses.
      - name: The release key must refuse bytes from the download channel
        run: python3 scripts/check-signing-refuses-untrusted.py

  website:
    # KHANDAQ (re-audit 2026-08-22, W-01/W-03). The site's security posture used to live in a
    # hand-edited nginx file on the host and in nobody's test. These three gates are the static
    # half; the runtime half runs from scripts/deploy-site.sh against public HTTPS after every
    # deploy, because a header that is present in the repository and absent on the wire is exactly
    # the failure mode this finding describes.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Security-header snippet must match the pages it hashes
        run: python3 scripts/generate-security-headers.py --check
      - name: security.txt must be valid and not near expiry
        run: python3 scripts/check-security-txt.py
      - name: Webfonts must be self-hosted, with no third-party origin
        run: python3 scripts/vendor-webfonts.py --check
      - name: nginx must accept the generated config
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq nginx >/dev/null
          sudo mkdir -p /etc/nginx/snippets /var/www/khandaq-site
          sudo cp infra/nginx/khandaq-security-headers.conf /etc/nginx/snippets/
          # Wrap the locations snippet in a minimal server block so `nginx -t` sees valid context.
          {
            echo 'events {}'
            echo 'http {'
            echo '  server {'
            echo '    listen 8080;'
            cat infra/nginx/khandaq-static-site.locations.conf
            echo '  }'
            echo '}'
          } | sudo tee /etc/nginx/khandaq-test.conf >/dev/null
          sudo nginx -t -c /etc/nginx/khandaq-test.conf

  android-unit-tests:
    # KHANDAQ (re-audit 2026-08-22, S-01). The 172 JVM tests existed and ran only on a TAG, inside
    # release-provenance — that is, after the decision to release had already been made. Nothing ran
    # them on a pull request, so "required Android tests" had nothing to require. They run here.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install and verify the Android toolchain (fail closed)
        run: bash scripts/ci-android-toolchain.sh install khandaq-android-trifa/android-refimpl-app
      - name: Provide google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: bash scripts/ci-google-services.sh
      - name: Run JVM unit tests
        run: |
          set -euo pipefail
          cd khandaq-android-trifa/android-refimpl-app
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest
          # A green run over an EMPTY suite is the vacuous pass this repository has been bitten by
          # before, so the count is asserted rather than assumed.
          total=$(grep -ho 'tests="[0-9]*"' app/build/test-results/testDebugUnitTest/*.xml \
                  | grep -oE '[0-9]+' | awk '{s+=$1} END {print s+0}')
          echo "unit tests executed: ${total:-0}"
          if [ "${total:-0}" -lt 1 ]; then
            echo "::error::testDebugUnitTest reported no executed tests" >&2
            exit 1
          fi

  dependencies-sbom:
    # KHANDAQ (re-review 2026-08-22, KQ-06). Pinning is not monitoring: witness.gradle, Podfile.lock,
    # Gemfile.lock and the hash-locked relay requirements all guarantee that today's build matches
    # yesterday's, and say nothing about a version that became vulnerable overnight. Android's 338
    # Maven artifacts, the pods and the gems had no advisory coverage at all.
    #
    # Runs on pull requests AND weekly, because the failure mode this closes is a new advisory
    # against unchanged source — which no PR-only gate can ever see.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: The SBOM must still describe the lockfiles
        run: python3 scripts/generate-sbom.py --check
      - name: Waiver shape and expiry, without touching the network
        run: python3 scripts/check-vulnerable-deps.py --offline
      - name: Scan every ecosystem against OSV
        run: python3 scripts/check-vulnerable-deps.py
      # KHANDAQ (re-review v2 2026-08-22, RR2-08): OSV has no `generic` ecosystem, so the vendored C
      # libraries — the largest memory-unsafe surface, decoding untrusted media and packets — had no
      # advisory coverage at all. The first run of this found 114, including a critical in the
      # libvpx that ships in every APK. Structure and coverage on every run; NVD is rate-limited, so
      # the network pass runs on the schedule.
      - name: Native components must all be scanned or explicitly excused
        run: python3 scripts/check-native-advisories.py --offline
      - name: Native dependency advisories (scheduled)
        if: github.event_name == 'schedule'
        run: python3 scripts/check-native-advisories.py

  sast:
    # KHANDAQ (re-review 2026-08-22, KQ-10). CodeQL (see codeql.yml) covers Java/Kotlin, Python and
    # JavaScript and is advisory for its first cycle. This is the other half: repository-specific
    # dangerous patterns, plus Objective-C and Swift, which CodeQL does not reach here.
    #
    # This job IS blocking, and can be, because it is not a general-purpose scanner tuned against an
    # inherited codebase — it is six rules that are green today, each proven to fire on a fixture. A
    # new finding therefore means new code, not a new query.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install semgrep
        run: python3 -m pip install --quiet semgrep
      - name: Rules must fire on their fixtures and be silent on the tree
        run: python3 scripts/check-sast-fixtures.py

  native-static-analysis:
    # KHANDAQ (re-review v2 2026-08-22, RR2-12). The targeted harnesses in this repository each pin a
    # defect somebody already understood; none of them is a general analyser. The desktop is the
    # largest memory-unsafe surface in the product — it parses peer-supplied media, files and
    # protocol packets — and CodeQL cannot reach it here, because c-cpp needs to observe a real
    # compilation and this runner has no Qt toolchain.
    #
    # cppcheck needs no build, so it is the part that exists today. Baseline-compared: inherited
    # findings do not block, new ones do. A CodeQL c-cpp build and sanitizer-backed fuzzing of the
    # packet and media parsers remain open, and saying so here is better than implying coverage.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install cppcheck and the Qt form compiler
        run: sudo apt-get update -qq && sudo apt-get install -y -qq cppcheck qtbase5-dev-tools
      - name: No new static-analysis findings in the desktop sources
        run: python3 scripts/check-native-static-analysis.py
      # KHANDAQ (deep review follow-up 2026-08-23): there is no desktop BUILD in CI, so a broken .ui
      # or a mistyped widget name reaches a release build with nothing in between. uic parsing each
      # form and cross-checking every `ui->widget` against it costs seconds and catches that class.
      # A small part of RR2-12, not a substitute for compiling the desktop.
      - name: Qt forms must compile and match the widgets the code names
        run: python3 scripts/check-desktop-ui-forms.py

  live-site:
    # KHANDAQ (re-audit 2026-08-22, W-01/W-02/W-03). The audit asks for header assertions "из
    # trusted CI environment" and for an external check that notices a stale site or an expiring
    # security.txt. deploy-site.sh already probes after every deploy, but that only runs when
    # somebody deploys — and W-02 was precisely a site nobody had deployed for a while.
    #
    # So the same probe runs on a schedule, from a machine that is neither the web server nor a
    # maintainer's laptop. It does not demand the site be at HEAD (it never is for long); it demands
    # the published commit EXISTS, the header baseline is intact on every response class, the CSP
    # still covers what is actually being served, security.txt has not lapsed, every artifact has a
    # signature beside it, and TLS 1.0/1.1 stay refused.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Probe the live site from outside
        run: python3 scripts/verify-site-deploy.py --any-sha
      # KHANDAQ (re-review v2 2026-08-22, RR2-03): existence of the published commit is not
      # freshness. On 22 August the site advertised 0.2.40 while two releases with security changes
      # had shipped. The download page is where a user checks what they are installing against what
      # was published, so it gets a bounded staleness budget rather than an open-ended one.
      - name: The published site must state the release being shipped
        run: python3 scripts/check-site-freshness.py

  relay-tests:
    # KHANDAQ (audit round 3, F-15): until now NO workflow ran these.
    #
    # The root .github/workflows contained exactly one test invocation — :app:testDebugUnitTest in
    # release-provenance.yml — and that workflow fires only on workflow_dispatch and v* tags, never on
    # a push or a pull request. So the relay suite, which is what holds R-01 (the cap-inertness pins),
    # R-02 (auth-mode behaviour) and the /register absence in place, was executed by a human on a
    # laptop and by nothing else. scripts/deploy-push-relay.sh ships this service to production
    # without running them either.
    #
    # The nested khandaq-android-trifa/.github/workflows/* do call connectedAndroidTest, but that
    # directory is part of THIS repository rather than a submodule, so GitHub Actions never reads
    # those files — and every one of those calls is suffixed `|| echo "NOERR"` and could not fail if
    # it did.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5
        with:
          python-version: '3.12'
      - name: Install the test dependencies
        run: python3 -m pip install --quiet flask pytest requests google-auth
      - name: Push-relay test suite
        run: |
          set -euo pipefail
          # Anti-vacuity, same discipline as the release job: a suite that collects nothing passes
          # loudly here instead of quietly.
          collected=$(python3 -m pytest infra/push/relay/test_app.py --collect-only -q 2>/dev/null                       | tail -1 | grep -oE '^[0-9]+' || echo 0)
          echo "collected $collected test(s)"
          if [ "${collected:-0}" -lt 80 ]; then
            echo "::error::only $collected relay tests collected, expected at least 80 — the suite "                  "has shrunk or stopped being discovered" >&2
            exit 1
          fi
          python3 -m pytest infra/push/relay/test_app.py -q

  ngc-downgrade-parity:
    # KHANDAQ (K-01): the anti-downgrade rule is implemented twice, in Java and in Objective-C, and
    # a security rule enforced on one client but not the other is not a rule. The Java side has
    # NgcHistoryDowngradePolicyTest; nothing covered the ObjC side, because no CI job here has Xcode.
    # This compiles the real policy body as C and runs the same truth table, on Linux.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: iOS anti-downgrade policy must match the Android truth table
        run: python3 scripts/check-ios-downgrade-policy.py
      # KHANDAQ (audit round 3, F-03): the rule was enforced on the TEXT packet only, on both clients.
      - name: Both history packet types must be gated on both clients
        run: python3 scripts/check-history-file-gate.py
      # KHANDAQ (2026-08-23): the audio decode path read four bytes out of a payload whose length
      # nothing had checked — an assert on iOS, nothing at all on the desktop, and NDEBUG removes
      # asserts from the builds users run. One packet from a contact already in a call.
      - name: The audio path must check the payload length before trusting it
        run: python3 scripts/check-audio-length-gate.py
      # KHANDAQ (2026-08-23, CodeQL triage): a group file's name arrives unfiltered off the wire, and
      # it was stored as-is on the row. send_ngch_syncfile joins that name with the directory, reads the
      # file and sends the bytes to a peer — so ../ in a filename read a file outside the group and
      # handed it out. Same name was both source and destination of the export copy.
      - name: A peer-supplied filename must never steer a read or write path
        run: python3 scripts/check-incoming-filename-sanitizer.py
      # KHANDAQ (2026-08-23, CodeQL triage): PRAGMA key escaped the passphrase and PRAGMA rekey did
      # not, so a password containing a quote rekeyed the database to a truncated value while the app
      # kept opening it with the escaped one — the database stops opening with the password just set.
      - name: The database passphrase must be escaped in every PRAGMA
        run: python3 scripts/check-sqlcipher-key-escaping.py
      # KHANDAQ (2026-08-24): the download cards carried their glyphs as inline data: URIs, and
      # img-src 'self' made the browser drop all five — the page shipped with empty squares and
      # nothing failed, because the header check verifies the headers rather than the pages under them.
      - name: Page assets must survive the site's own CSP
        run: python3 scripts/check-site-csp-assets.py
      # KHANDAQ (release 0.2.40): 15 QA scripts drove org.khandaq.messenger (the namespace) while the
      # app installs as com.khandaq.messenger, so each ran to completion without touching the app.
      - name: QA scripts must target the package the app installs as
        run: python3 scripts/check-qa-script-package.py

      # KHANDAQ (re-audit 2026-08-22, K-03): the credential must stay out of the request URI. This
      # is the kind of change a "simplify the push call" refactor reverts invisibly — notifications
      # keep working perfectly while the targeting token goes back into the URL.
      - name: Wake requests must carry the token in the body, not the URL
        run: python3 scripts/check-push-emission-shape.py

      # KHANDAQ (re-audit 2026-08-22, M-01): the manifest and the documented matrix must agree, so a
      # permission cannot be added without a line saying which feature needs it.
      - name: Android permissions must match the documented matrix
        run: python3 scripts/check-android-permissions.py

      # KHANDAQ (re-review 2026-08-22, KQ-08): a per-contact capability is a bearer secret. Both
      # halves that touch it are in different languages and different targets, and a service string
      # changed on one side only fails silently — URLs go out with no capability, which looks exactly
      # like a device that has not registered.
      - name: iOS push capabilities must stay in the Keychain
        run: python3 scripts/check-ios-capability-storage.py
      # KHANDAQ (internal audit 2026-08-22): the share extension writes to an App Group that no
      # entitlements file declares, so it fails on every device, silently. The gap is owner-blocked
      # (the group must exist in the portal first) and recorded with an expiry; a NEW one fails here.
      - name: Every App Group used by the code must be declared
        run: python3 scripts/check-ios-app-groups.py

      # KHANDAQ (re-audit 2026-08-22): a device build overwrites this tracked binary with its own
      # slice. It has been swept into a commit twice, and in a diff it looks like a deliberate change.
      - name: The tracked vpx slice must be the simulator one
        run: python3 scripts/check-ios-vpx-slice.py
      # KHANDAQ (audit round 3, F-01): the vendored iOS toxav is a generation behind the desktop one
      # and install-tox-ngc.sh deliberately does not sync it, so the video reassembler has to be held
      # in place by something. This compiles the real function out of the shipped .m and attacks it.
      - name: iOS video-RTP reassembly must refuse the F-01 overflow
        run: python3 scripts/check-ios-rtp-reassembly.py
      # KHANDAQ (RR2-12, 2026-08-23): the case list above pins defects somebody already understood.
      # This drives the same real function with sequences nobody wrote down, under ASan+UBSan. It
      # finds both memory defects the 2026-08-23 review found by hand — verified by restoring the
      # pre-fix logic, where it reports `next_free_entry = 4, outside 0..3` within seconds.
      - name: Fuzz the RTP reassembly under sanitizers
        run: python3 scripts/check-rtp-fuzz.py --libfuzzer --seconds 45
      # KHANDAQ (2026-08-23): the first code a contact's lossless packet reaches, and what it
      # reports back becomes a QString in the chat window — so reading past the packet here is
      # memory disclosure rather than a crash. Fuzzing it found the missing bounds checks AND a
      # shift-width UB in the read macro that had been decoding every 8-byte field wrong.
      - name: Fuzz the toxext messages parser under sanitizers
        run: python3 scripts/check-toxext-fuzz.py --libfuzzer --seconds 45
      # KHANDAQ (2026-08-23): the H.264 Annex-B → AVCC converter rewrites a frame from a group
      # participant, and its output can be LARGER than its input (4 bytes of length prefix per 3
      # bytes of start code), so the whole thing rests on one size comparison.
      - name: Fuzz the NGC Annex-B converter under sanitizers
