name: Upload to Store

on:
#  push:
#    paths-ignore:
#     - 'README.md'
  workflow_dispatch:
    inputs:
      version:
        description: dummy
        default: dummy

defaults:
  run:
    shell: bash

jobs:
  macos-compile:
    runs-on: macos-12
    steps:
    - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3

    - name: Display the OS Version1
      run: sw_vers -productVersion

    - name: Display the OS Version2
      run: system_profiler SPSoftwareDataType

    - name: install pkgs
      run:  |
            # KHANDAQ (audit 2026-08-21, K-07): was `sudo gem install fastlane -NV`, which
            # force-installed the newest floating fastlane over the pinned one. Install from
            # the committed lock instead.
            bundle install

    - name: xcode info
      run:  |
            ls -al
            pwd
            id -a
            xcode-select --print-path

    - name: check compile output
      run:  |
            bundle exec fastlane ios release



