# KHANDAQ (security D-7/8/9): rebuild the Windows desktop binary with the bumped, patched
# bundled libraries (libvpx 1.14.0, OpenSSL 1.1.1w, FFmpeg 4.4.8). The desktop's own CI lives
# under khandaq-desktop/.github and is inactive in this monorepo (GitHub only runs root-level
# workflows), so the Windows cross-build never ran here. Manual trigger; produces the installer
# + zip + their SHA256 as artifacts. (Cross-build is impractical on an arm64 Mac → run in CI.)
name: Windows build (security D-7/8/9)

on:
  workflow_dispatch:

jobs:
  windows-x86_64:
    name: Cross-compile Windows x86_64 (Release)
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        working-directory: khandaq-desktop
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # NB: build with plain `docker build` (not docker compose / bake) — docker compose v2 trips a
      # false "cycle detected" on the dotted service name `windows_builder.i686` in docker-compose.yml.
      # Context is ./buildscripts (matches the compose `context: ./buildscripts`).
      - name: Build windows_builder image (cross-toolchain + patched deps)
        run: >
          docker build -f buildscripts/docker/Dockerfile.windows_builder
          --build-arg ARCH=x86_64 --build-arg WINEARCH=win64
          -t qtox_windows_builder:latest buildscripts

      - name: Cross-compile Khandaq desktop for Windows
        run: >
          docker run --rm -v "$PWD:/qtox" -w /qtox qtox_windows_builder:latest
          ./windows/cross-compile/build.sh --arch x86_64 --build-type Release --src-dir /qtox

      # KHANDAQ: this used to look for package-prefix/setup-qtox.exe, the upstream qTox name. Our
      # installer script defines INSTALLER_NAME "Khandaq-installer.exe" (windows/qtox64.nsi:11), so
      # the test never matched, `|| true` swallowed it, the upload pattern matched nothing, and
      # if-no-files-found: warn turned that into a warning. The result was a green build whose
      # artifact silently contained the zip alone — no installer, and no checksum for either, while
      # this file's own header promised all three. Checksums are now WRITTEN to a file and shipped
      # rather than only printed into a log nobody reads.
      - name: Checksums
        if: always()
        run: |
          set -euo pipefail
          ls -la package-prefix install-prefix 2>/dev/null || true
          rm -f SHA256SUMS.txt
          if [ -f package-prefix/Khandaq-installer.exe ]; then
            sha256sum package-prefix/Khandaq-installer.exe | tee -a SHA256SUMS.txt
          else
            echo "::error::installer missing: package-prefix/Khandaq-installer.exe"
            exit 1
          fi
          for z in install-prefix/*.zip; do
            [ -e "$z" ] || { echo "::error::no zip in install-prefix"; exit 1; }
            sha256sum "$z" | tee -a SHA256SUMS.txt
          done

      - name: Upload Windows artifacts
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: khandaq-windows-x86_64-release
          path: |
            khandaq-desktop/package-prefix/Khandaq-installer.exe
            khandaq-desktop/install-prefix/*.zip
            khandaq-desktop/SHA256SUMS.txt
          # error, not warn: a rename must break the build rather than quietly ship a partial
          # artifact, which is exactly how the installer went missing unnoticed.
          if-no-files-found: error
